[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efd"
version = "0.1.0"
description = "Detección de empresas fantasmas en una red sintética de facturación electrónica: ML tradicional, analítica de grafos y GNN."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.2",
    "torch_geometric>=2.5",
    "networkx>=3.2",
    "shap>=0.45",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
