# H1: Random Forest con G2 sobre la v2, 3 semillas, con ajuste de hiperparámetros; métricas globales y sin P1.
# Ajuste: la combinación de cada partición se elige por AUC-PR en validación (≤ 12, decisión 2026-11-13).

experiment:
  name: rf_g2_v2_ajuste
  scenario: data/synthetic/prev1_medio_s42   # generado con python -m efd.generation
  feature_set: G2                            # G1 = transactional; G2 = transactional + structural
  seeds: [42, 43, 44]                        # cada semilla repite el k-fold completo

model:
  name: random_forest
  params:
    n_estimators: 500                        # supuesto de diseño (Probst et al., 2019: no se ajusta)
    n_jobs: -1                               # usa todos los núcleos; no altera el resultado
  # supuesto de diseño: lista fija aprobada el 2026-11-16 antes de correr (Breiman, 2001; Probst et al., 2019)
  grid:
    - {max_features: sqrt, min_samples_leaf: 1, class_weight: balanced}
    - {max_features: sqrt, min_samples_leaf: 1, class_weight: balanced_subsample}
    - {max_features: sqrt, min_samples_leaf: 5, class_weight: balanced}
    - {max_features: sqrt, min_samples_leaf: 5, class_weight: balanced_subsample}
    - {max_features: 0.2, min_samples_leaf: 1, class_weight: balanced}
    - {max_features: 0.2, min_samples_leaf: 1, class_weight: balanced_subsample}
    - {max_features: 0.2, min_samples_leaf: 5, class_weight: balanced}
    - {max_features: 0.2, min_samples_leaf: 5, class_weight: balanced_subsample}
    - {max_features: 0.5, min_samples_leaf: 1, class_weight: balanced}
    - {max_features: 0.5, min_samples_leaf: 1, class_weight: balanced_subsample}
    - {max_features: 0.5, min_samples_leaf: 5, class_weight: balanced}
    - {max_features: 0.5, min_samples_leaf: 5, class_weight: balanced_subsample}

features:
  transactional:
    round_multiple: 100                      # monto redondo = múltiplo de 100 (docs/features_design.md)
  structural: {}

splits:
  n_splits: 5                                # k-fold estratificado sobre nodos
  val_size: 0.2                              # fracción de los nodos fuera de prueba para validación

threshold:
  strategy: max_f1                           # umbral que maximiza F1 en validación

evaluation:
  metrics: [auc_pr, auc_roc, f1, precision, recall, fpr]   # por pliegue
  precision_at_k: [100, 200, 400]                          # sobre los pliegues juntos, por semilla
  subpopulations: {sin_p1: [isolated_emitter]}   # población de H1 (bitácora 2026-11-13)
